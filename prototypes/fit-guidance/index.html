<meta charset="utf-8">
<title>FOSLN Fit Guidance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* PROTOTYPE. Throwaway fit guidance for "Design the fit guidance" (Kintukka2/FOSLN-WATCH#20). Not production code.
   Layout: the Size & fit section of PDP layout E, in four forms (A-D), for ACIER or CADRE, in a desktop or phone frame.
   Built on the locked Direction D, Two Metals, with E's onyx backdrop: dark only, so this page commits to one dark look. */
:root {
  --onyx: #0B0B0C; --warm-black: #0E0C09; --bone: #EDEBE6; --muted: #9A9C9F;
  --steel: #C9CDD1; --gold: #D6B271;
  --page: var(--onyx); --surface: #131416; --raise: #1B1C1F; --accent: var(--steel); --accent-ink: #111214;
  --line: rgba(237,235,230,.12); --slot: #141517; --skin: #1E1F22;
  --display: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --chrome-bg: #0A0A0B; --chrome-ink: #F2F2F0; --chrome-dim: #A3A5A8; --chrome-line: rgba(255,255,255,.14);
  --paper: #F4F2EE; --paper-ink: #1A1A1A; --paper-dim: #6B6B6B;
  color-scheme: dark;
}
.pdp[data-model="cadre"] {
  --page: var(--warm-black); --surface: #16130E; --raise: #1F1B14; --accent: var(--gold); --accent-ink: #17120A;
  --line: rgba(214,178,113,.16); --slot: #17140F; --skin: #221E17;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--chrome-bg); color: var(--bone); font: 400 15px/1.55 var(--body); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── prototype chrome ── */
.proto { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.note { display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 8px 16px; font: 500 12px/1.4 var(--mono); color: var(--chrome-dim); border-bottom: 1px solid var(--chrome-line); }
.note b { color: var(--chrome-ink); font-weight: 500; }
.note .url { color: var(--chrome-ink); overflow-wrap: anywhere; }
.stage { min-height: 0; display: grid; place-items: stretch center; padding: 12px 16px; overflow: hidden; }
.viewport { container-type: inline-size; width: 100%; max-width: 1440px; height: 100%; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--chrome-line); border-radius: 6px; background: var(--page); position: relative; }
.proto[data-frame="phone"] .viewport { width: 390px; max-width: 100%; max-height: 844px; border-radius: 28px; border-width: 6px; border-color: #26272A; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--chrome-line); }
.grp { display: flex; gap: 2px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--chrome-line); border-radius: 999px; background: #141416; }
.grp button { border: 0; background: transparent; color: var(--chrome-ink); min-height: 36px; padding: 0 14px; border-radius: 999px; font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap; }
.grp button[aria-pressed="true"] { background: var(--chrome-ink); color: #111; }
.grp .k { align-self: center; padding: 0 6px 0 10px; font: 500 12px/1 var(--mono); color: var(--chrome-dim); white-space: nowrap; }
.notes { position: fixed; right: 16px; bottom: 76px; width: min(460px, calc(100vw - 32px)); max-height: min(72vh, 680px); overflow: auto; z-index: 40; background: #161618; color: var(--chrome-ink); border: 1px solid var(--chrome-line); border-radius: 10px; padding: 18px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.notes h2 { margin: 0 0 4px; font: 600 16px/1.3 var(--body); }
.notes h3 { margin: 18px 0 8px; font: 500 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--chrome-dim); }
.notes .sub { margin: 0 0 14px; color: var(--chrome-dim); font-size: 13px; }
.notes dl { margin: 0; display: grid; gap: 12px; }
.notes dt { font: 500 12px/1.3 var(--mono); color: var(--chrome-dim); }
.notes dd { margin: 3px 0 0; font-size: 14px; line-height: 1.5; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
@media (max-width: 700px) { .grp[data-frames] { display: none; } .stage { padding: 0; } .viewport, .proto[data-frame="phone"] .viewport { width: 100%; max-height: none; border: 0; border-radius: 0; } .notes { bottom: 150px; } }

/* ── the PDP around the section ── */
.pdp { background: var(--page); color: var(--bone); min-height: 100%; }
.hdr { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; height: 60px; padding: 0 28px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hdr nav { display: flex; gap: 22px; font: 500 13px/1 var(--body); letter-spacing: .08em; color: var(--muted); }
.hdr nav span[aria-current="true"] { color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent); padding-bottom: 4px; }
.hdr .menu { display: none; font: 500 13px/1 var(--body); color: var(--muted); }
.wm { font: 400 17px/1 var(--display); letter-spacing: .32em; padding-left: .32em; color: var(--bone); }
.tools { display: flex; justify-content: flex-end; gap: 18px; font: 500 13px/1 var(--body); }
.tools .cur { color: var(--muted); }
.stub { margin: 0 auto; max-width: 1100px; padding: 28px; }
.stub .box { display: grid; gap: 4px; place-items: center; text-align: center; min-height: 110px; padding: 20px; border: 1px dashed var(--line); border-radius: 4px; }
.stub b { font: 600 15px/1.3 var(--body); color: var(--muted); }
.stub span { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.sec { padding: 56px 28px; border-top: 1px solid var(--line); }
.sec .wrap { max-width: 1100px; margin: 0 auto; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 24px; flex-wrap: wrap; margin-bottom: 28px; }
.blk-h { margin: 0; font: 600 20px/1.3 var(--body); color: var(--bone); text-wrap: balance; }
.sec-head .for { font: 400 12px/1.4 var(--mono); letter-spacing: .06em; color: var(--muted); }
.sec-head .for b { color: var(--accent); font-weight: 500; }
.foot { padding: 36px 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* shared facts strip */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 40px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
.facts h3 { margin: 0 0 8px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.facts p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--bone); max-width: 40ch; }
.facts p + p { margin-top: 6px; }
.facts .dim { color: var(--muted); }
.ex { font: 400 12px/1.4 var(--mono); color: var(--muted); border: 1px dashed var(--line); padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.lead { margin: 0 0 22px; font: 400 clamp(20px, 2.2cqi, 26px)/1.35 var(--display); max-width: 30ch; text-wrap: balance; }
.lead em { color: var(--accent); font-style: italic; }
.mono-cap { font: 400 12px/1.5 var(--mono); color: var(--muted); }

/* drawings */
.drw .body { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }
.drw .fine { fill: none; stroke: var(--accent); stroke-width: .8; opacity: .6; }
.drw .frame { fill: none; stroke: var(--accent); opacity: .9; }
.drw .dialf { fill: var(--raise); stroke: var(--accent); stroke-width: .8; }
.drw .band { fill: var(--surface); stroke: var(--accent); stroke-width: 1; opacity: .9; }
.drw .hand { stroke: var(--bone); stroke-linecap: round; }
.drw .dimln { stroke: var(--accent); stroke-width: 1; }
.drw .dimtx { fill: var(--accent); font: 500 15px var(--mono); }
.drw .dimtx.b { fill: var(--bone); }
.drw .wrist { fill: var(--skin); stroke: rgba(237,235,230,.28); stroke-width: 1.2; }
.drw .top { stroke: var(--bone); stroke-width: 1; stroke-dasharray: 3 4; opacity: .55; }
.drw .lbl { fill: var(--muted); font: 400 13px var(--mono); letter-spacing: .06em; }

/* ── A · wrist guide ── */
.a-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px 56px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
.chip { min-width: 52px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; background: none; cursor: pointer; font: 500 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--bone); transition: background .15s steps(2, end); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.verdict { display: grid; gap: 6px; padding: 16px 18px; border-left: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.verdict b { font: 600 16px/1.35 var(--body); }
.verdict span { font-size: 14px; color: var(--muted); }
.a-fig { margin: 0; display: grid; gap: 10px; }
.a-fig svg { width: 100%; height: auto; display: block; }

/* ── B · life size on screen ── */
.b-steps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 48px; }
.b-step { display: grid; gap: 14px; align-content: start; }
.b-step h3 { margin: 0; font: 600 16px/1.3 var(--body); display: flex; gap: 10px; align-items: baseline; }
.b-step h3 i { font: 500 12px/1 var(--mono); font-style: normal; color: var(--accent); }
.b-step p { margin: 0; font-size: 14px; color: var(--muted); max-width: 44ch; }
.card-wrap, .life-wrap { overflow: hidden; padding: 6px 0; min-height: 40px; }
.card { border: 1.5px dashed var(--accent); border-radius: 3.18mm; display: grid; place-items: center; font: 400 12px/1.3 var(--mono); color: var(--muted); text-align: center; }
.cal { display: flex; align-items: center; gap: 12px; }
.cal input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 44px; }
.cal button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: 2px; background: none; cursor: pointer; font: 500 18px/1 var(--mono); color: var(--accent); }
.life { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
.life figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
.life svg { display: block; overflow: visible; }
.ok { font: 500 12px/1.4 var(--mono); color: var(--accent); }

/* ── C · printable sheet ── */
.c-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 56px; align-items: start; }
.sheet { width: 100%; max-width: 380px; aspect-ratio: 210 / 297; background: var(--paper); border-radius: 2px; box-shadow: 0 24px 50px rgba(0,0,0,.5); justify-self: center; overflow: hidden; }
.sheet svg { width: 100%; height: 100%; display: block; }
.c-list { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
.c-list li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; font-size: 15px; }
.c-list li::before { content: counter(s); font: 500 13px/1.6 var(--mono); color: var(--accent); }
.c-list b { font-weight: 600; }
.dl { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px; margin-top: 24px; border: 1px solid var(--accent); border-radius: 2px; background: none; cursor: pointer; font: 700 14px/1 var(--body); letter-spacing: .04em; color: var(--accent); }
.dl:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* ── D · on the wrist ── */
.d-photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.ph { position: relative; aspect-ratio: 4 / 3.4; display: grid; place-items: center; overflow: hidden; background: var(--slot); }
.ph::before { content: ""; position: absolute; inset: 14px; border: 1px dashed var(--line); border-radius: 4px; pointer-events: none; }
.ph .need { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 20px; max-width: 32ch; }
.ph .need b { font: 500 14px/1.3 var(--body); color: var(--bone); }
.ph .need span { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.cap { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px 0; font: 400 12px/1.4 var(--mono); color: var(--muted); }
.cap b { color: var(--bone); font-weight: 500; }

/* ── phone width ── */
@container (max-width: 760px) {
  .hdr { grid-template-columns: auto 1fr auto; padding: 0 16px; }
  .hdr nav { display: none; }
  .hdr .menu { display: block; }
  .hdr .wm { justify-self: center; font-size: 15px; }
  .tools { gap: 12px; }
  .stub { padding: 20px 16px; }
  .sec { padding: 40px 16px; }
  .foot { padding: 28px 16px; }
  .facts { grid-template-columns: 1fr; gap: 22px; margin-top: 32px; }
  .a-grid, .b-steps, .c-grid { grid-template-columns: 1fr; gap: 24px; }
  .chip { min-width: 0; flex: 1 0 calc(25% - 6px); }
  .d-photos { grid-template-columns: 1fr; }
  .lead { font-size: 19px; }
  .a-fig .dimtx { font-size: 20px; }
  .a-fig .lbl { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="proto" id="proto" data-frame="desktop">
  <div class="note">
    <span><b>Prototype</b> for "Design the fit guidance". Throwaway. Sizes are the provisional ones. No photos exist yet, so photo slots are marked.</span>
    <span class="url" id="url"></span>
  </div>
  <div class="stage"><div class="viewport" id="vp"></div></div>
  <div class="bar" role="toolbar" aria-label="Prototype controls">
    <div class="grp" data-group="v">
      <button type="button" data-val="e">Chosen · D + A</button>
      <button type="button" data-val="a">A · Wrist guide</button>
      <button type="button" data-val="b">B · Life size on screen</button>
      <button type="button" data-val="c">C · Printable sheet</button>
      <button type="button" data-val="d">D · On the wrist</button>
    </div>
    <div class="grp" data-group="m">
      <button type="button" data-val="acier">ACIER</button>
      <button type="button" data-val="cadre">CADRE</button>
    </div>
    <div class="grp" data-group="f" data-frames>
      <button type="button" data-val="desktop">Desktop</button>
      <button type="button" data-val="phone">Phone</button>
    </div>
    <div class="grp" data-group="r">
      <span class="k">Bracelet range</span>
      <button type="button" data-val="none">Not measured</button>
      <button type="button" data-val="ex">Example</button>
    </div>
    <div class="grp">
      <button type="button" id="notes-btn" aria-pressed="false" aria-controls="notes">What it decides</button>
    </div>
  </div>
  <aside class="notes" id="notes" hidden aria-live="polite"></aside>
</div>

<script>
/* Provisional figures from docs/specs/models.md. W = case width, L = lug to lug (CADRE: case length), B = bracelet width at the case. */
const MODELS = {
  acier: { name: "ACIER", shape: "round", W: 37, L: 43, T: 9.5, B: 16.3, dial: "Onyx" },
  cadre: { name: "CADRE", shape: "square", W: 32, L: 36.3, T: 10, B: 16.8, dial: "Noir" }
};
/* "Example" range is a stand-in to show the layout once a sample is measured. It is not a FOSLN figure. */
const EX_RANGE = { acier: [15, 20], cadre: [14.5, 19] };
const state = { v: "e", m: "acier", f: "desktop", r: "none", wrist: 17, k: 96 / 25.4, notes: false };
const $ = s => document.querySelector(s);
const mmTop = cm => cm * 10 / 3; /* the flat top of a wrist is about a third of its circumference */

/* ── front view of a Model, centred on (cx, cy), s px per mm ── */
function front(M, cx, cy, s, opts = {}) {
  const W = M.W * s, L = M.L * s, B = M.B * s, top = cy - L / 2, bot = cy + L / 2, stub = opts.stub ?? 8 * s;
  let o = "";
  if (stub) o += `<rect class="band" x="${cx - B / 2}" y="${top - stub}" width="${B}" height="${stub + 1}"/><rect class="band" x="${cx - B / 2}" y="${bot - 1}" width="${B}" height="${stub + 1}"/>`;
  let r;
  if (M.shape === "round") {
    const p = [[-.29, -.5], [.29, -.5], [.5, -.17], [.5, .17], [.29, .5], [-.29, .5], [-.5, .17], [-.5, -.17]];
    const poly = k => p.map(([x, y]) => `${cx + x * W * k},${cy + y * L * k}`).join(" ");
    r = W / 2 * .86 * .84;
    o += `<polygon class="body" points="${poly(1)}"/><polygon class="fine" points="${poly(.9)}"/><circle class="fine" cx="${cx}" cy="${cy}" r="${W / 2 * .86}"/><circle class="dialf" cx="${cx}" cy="${cy}" r="${r}"/>`;
  } else {
    const fi = 2.2 * s, di = 3.6 * s;
    r = (W - 2 * di) / 2;
    o += `<rect class="body" x="${cx - W / 2}" y="${top}" width="${W}" height="${L}" rx="${2.4 * s}"/>
      <rect class="frame" x="${cx - W / 2 + fi}" y="${top + fi}" width="${W - 2 * fi}" height="${L - 2 * fi}" rx="${1.4 * s}" stroke-width="${Math.max(1.2, 1 * s)}"/>
      <rect class="dialf" x="${cx - W / 2 + di}" y="${top + di}" width="${W - 2 * di}" height="${L - 2 * di}" rx="${.8 * s}"/>
      <rect class="fine" x="${cx + W / 2 - di - 5.2 * s}" y="${cy - 1.5 * s}" width="${3.6 * s}" height="${3 * s}"/>
      <rect class="body" x="${cx + W / 2}" y="${cy - 1.6 * s}" width="${1.6 * s}" height="${3.2 * s}" rx="1"/>`;
  }
  if (!opts.noHands) {
    const hand = (deg, l, w) => { const a = deg * Math.PI / 180; return `<line class="hand" x1="${cx}" y1="${cy}" x2="${cx + Math.sin(a) * l}" y2="${cy - Math.cos(a) * l}" stroke-width="${w}"/>`; };
    o += hand(305, r * .5, Math.max(1.6, .55 * s)) + hand(60, r * .74, Math.max(1.2, .4 * s));
  }
  return o;
}

/* ── shared facts: bracelet range, measuring, resizing ── */
function facts() {
  const ex = EX_RANGE[state.m];
  const range = state.r === "ex"
    ? `<p>Closes round wrists from <b>${ex[0]} to ${ex[1]} cm</b>. <span class="ex">example</span></p><p class="dim">With every link in, it fits up to ${ex[1]} cm. Take links out for a smaller wrist.</p>`
    : `<p class="dim">This line appears once a sample is measured. Until then, the section shows no range.</p>`;
  return `<div class="facts">
    <div><h3>Bracelet range</h3>${range}</div>
    <div><h3>Measure your wrist</h3><p>Wrap a strip of paper round your wrist, just above the wrist bone. Mark where it overlaps, then measure the strip in cm.</p></div>
    <div><h3>Taking out links</h3><p class="dim">How links come out, and what you need, waits on the pin type (from the samples) and on whether the Supplier can size bracelets before Dispatch.</p></div>
  </div>`;
}

/* ── A · wrist guide: your wrist, drawn to scale with the watch on it ── */
function vA(noFacts) {
  const M = MODELS[state.m], cm = state.wrist, top = mmTop(cm), s = 3.4;
  const vw = 520, vh = 300, cx = 250, cy = 150, w = top * s;
  /* forearm on the left, hand on the right; the wrist is narrowest at the watch */
  const half = x => w / 2 * (1 + Math.pow((x - cx) / 300, 2) * .28);
  let up = "", dn = "";
  for (let x = 0; x <= vw; x += 10) { up += `${x ? "L" : "M"}${x} ${cy - half(x)} `; dn = `L${x} ${cy + half(x)} ` + dn; }
  const arm = `<path class="wrist" d="${up}${dn.replace(/^L/, "L")}Z"/>`;
  const L = M.L * s, inside = M.L <= top, pct = Math.round(M.L / top * 100);
  const strap = `<rect class="band" x="${cx - M.B * s / 2}" y="${cy - half(cx) - 2}" width="${M.B * s}" height="${half(cx) * 2 + 4}" opacity=".85"/>`;
  const dx = cx + 150;
  const svg = `<svg class="drw" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="${M.name} on a ${cm} cm wrist, drawn to scale">
    ${arm}${strap}${front(M, cx, cy, s, { stub: 0 })}
    <line class="top" x1="${cx - 70}" y1="${cy - w / 2}" x2="${dx + 6}" y2="${cy - w / 2}"/><line class="top" x1="${cx - 70}" y1="${cy + w / 2}" x2="${dx + 6}" y2="${cy + w / 2}"/>
    <line class="dimln" x1="${dx}" y1="${cy - w / 2}" x2="${dx}" y2="${cy + w / 2}" style="stroke:var(--bone);opacity:.7"/>
    <text class="dimtx b" x="${dx + 10}" y="${cy - 4}">≈${Math.round(top)} mm</text><text class="lbl" x="${dx + 10}" y="${cy + 14}">top of wrist</text>
    <line class="dimln" x1="${cx - 70}" y1="${cy - L / 2}" x2="${cx - 70}" y2="${cy + L / 2}"/>
    <line class="dimln" x1="${cx - 76}" y1="${cy - L / 2}" x2="${cx - M.W * s / 2 * .6}" y2="${cy - L / 2}" stroke-dasharray="2 3" opacity=".6"/><line class="dimln" x1="${cx - 76}" y1="${cy + L / 2}" x2="${cx - M.W * s / 2 * .6}" y2="${cy + L / 2}" stroke-dasharray="2 3" opacity=".6"/>
    <text class="dimtx" x="${cx - 80}" y="${cy + 5}" text-anchor="end">${M.L} mm</text>
    <text class="lbl" x="${vw - 8}" y="${vh - 10}" text-anchor="end">HAND →</text>
  </svg>`;
  const chips = [14, 15, 16, 17, 18, 19, 20, 21].map(c => `<button type="button" class="chip" data-wrist="${c}" aria-pressed="${c === cm}">${c}</button>`).join("");
  const verdict = inside
    ? `<b>The lugs sit inside the top of your wrist.</b><span>${M.name} spans ${M.L} mm across a wrist top of about ${Math.round(top)} mm, so it covers ${pct}% of it.</span>`
    : `<b>The lugs reach past the top of your wrist.</b><span>${M.name} spans ${M.L} mm, and a ${cm} cm wrist is about ${Math.round(top)} mm across the top. It will wear large.</span>`;
  return `<div class="a-grid">
    <div><p class="lead">Pick your wrist size, in cm, and see <em>${M.name}</em> on it.</p>
      <div class="chips" role="group" aria-label="Wrist size in cm">${chips}</div>
      <div class="verdict" aria-live="polite">${verdict}</div>
      <p class="mono-cap" style="margin:12px 0 0">Drawn to scale. The top of a wrist is taken as a third of its size; yours may be wider or narrower.</p></div>
    <figure class="a-fig">${svg}</figure>
  </div>${noFacts ? "" : facts()}`;
}

/* ── B · life size on screen, after matching a bank card ── */
function vB() {
  const M = MODELS[state.m], k = state.k;
  const cw = 85.6 * k, ch = 53.98 * k;
  const pad = 14 * k, w = (M.W + 6) * k, h = (M.L + 22) * k;
  const life = `<svg class="drw" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${M.name} at life size">${front(M, w / 2, h / 2, k, { stub: 11 * k })}</svg>`;
  const side = `<svg class="drw" width="${(M.T + 4) * k}" height="${h}" viewBox="0 0 ${(M.T + 4) * k} ${h}" role="img" aria-label="${M.name} side, at life size">
    <rect class="body" x="${2 * k + 1.1 * k}" y="${h / 2 - M.L * k / 2}" width="${(M.T - 1.1) * k}" height="${M.L * k}" rx="${M.shape === "square" ? 2.4 * k : M.T * k * .3}"/>
    <rect class="band" x="${(M.T + 2 - 3.6) * k}" y="${h / 2 - M.L * k / 2 - 11 * k}" width="${3.2 * k}" height="${11 * k}"/>
    <rect class="band" x="${(M.T + 2 - 3.6) * k}" y="${h / 2 + M.L * k / 2}" width="${3.2 * k}" height="${11 * k}"/></svg>`;
  return `<p class="lead">See <em>${M.name}</em> at its real size on your screen.</p>
  <div class="b-steps">
    <div class="b-step"><h3><i>1</i>Match a bank card</h3>
      <p>Hold any bank card flat against the screen. Drag the slider until the dashed outline matches the card's edges.</p>
      <div class="card-wrap"><div class="card" style="width:${cw}px;height:${ch}px">Bank card<br>85.6 × 54 mm</div></div>
      <div class="cal"><button type="button" data-k="-">−</button><input type="range" id="kr" min="2.4" max="7" step="0.01" value="${k}" aria-label="Screen scale"><button type="button" data-k="+">+</button></div>
    </div>
    <div class="b-step"><h3><i>2</i>Hold your wrist up to it</h3>
      <p>The watch below is now life size. Lay your wrist beside it, or rest your phone on your wrist, to see how much it covers.</p>
      <div class="life-wrap"><div class="life"><figure>${life}<figcaption class="mono-cap">Front</figcaption></figure><figure>${side}<figcaption class="mono-cap">Side, ${M.T} mm</figcaption></figure></div></div>
      <span class="ok">Life size once the card matches.</span>
    </div>
  </div>${facts()}`;
}

/* ── C · printable sheet: both Models at 1:1, a card check and a wrist ruler ── */
function sheet() {
  const s = 1; /* the sheet is drawn in mm: viewBox 210 × 297 */
  const P = "var(--paper-ink)";
  let ruler = "";
  const rx = 182, ry0 = 20, rlen = 250;
  for (let mm = 0; mm <= 250; mm += 5) {
    const y = ry0 + mm;
    const big = mm % 10 === 0;
    ruler += `<line x1="${rx}" y1="${y}" x2="${rx + (big ? 6 : 3.5)}" y2="${y}" stroke="${P}" stroke-width=".3"/>`;
    if (big && mm >= 100) ruler += `<text x="${rx + 7.5}" y="${y + 1.3}" font-size="3.6" font-family="JetBrains Mono, monospace" fill="${P}">${mm / 10}</text>`;
  }
  const watchOn = (M, cx, cy) => {
    const W = M.W, L = M.L, B = M.B;
    const out = M.shape === "round"
      ? `<polygon points="${[[-.29, -.5], [.29, -.5], [.5, -.17], [.5, .17], [.29, .5], [-.29, .5], [-.5, .17], [-.5, -.17]].map(([x, y]) => `${cx + x * W},${cy + y * L}`).join(" ")}" fill="none" stroke="${P}" stroke-width=".35"/><circle cx="${cx}" cy="${cy}" r="${W / 2 * .86}" fill="none" stroke="${P}" stroke-width=".25"/>`
      : `<rect x="${cx - W / 2}" y="${cy - L / 2}" width="${W}" height="${L}" rx="2.4" fill="none" stroke="${P}" stroke-width=".35"/><rect x="${cx - W / 2 + 2.2}" y="${cy - L / 2 + 2.2}" width="${W - 4.4}" height="${L - 4.4}" rx="1.4" fill="none" stroke="${P}" stroke-width=".25"/>`;
    const strap = `<rect x="${cx - B / 2}" y="${cy - L / 2 - 50}" width="${B}" height="50" fill="none" stroke="${P}" stroke-width=".25" stroke-dasharray="1.2 1"/><rect x="${cx - B / 2}" y="${cy + L / 2}" width="${B}" height="50" fill="none" stroke="${P}" stroke-width=".25" stroke-dasharray="1.2 1"/>`;
    return `${strap}${out}<text x="${cx}" y="${cy + L / 2 + 56}" text-anchor="middle" font-size="4.2" font-family="Libre Baskerville, Georgia, serif" letter-spacing="1.2" fill="${P}">${M.name}</text><text x="${cx}" y="${cy + L / 2 + 61}" text-anchor="middle" font-size="2.8" font-family="JetBrains Mono, monospace" fill="#6B6B6B">${M.shape === "round" ? `${M.W} mm · ${M.L} mm lug to lug` : `${M.W} × ${M.L} mm`}</text>`;
  };
  return `<svg viewBox="0 0 210 297" role="img" aria-label="Preview of the printable life-size sheet">
    <rect width="210" height="297" fill="var(--paper)"/>
    <text x="16" y="20" font-size="6" font-family="Libre Baskerville, Georgia, serif" letter-spacing="2.4" fill="${P}">FOSLN</text>
    <text x="16" y="27" font-size="3.4" font-family="Manrope, Arial, sans-serif" fill="${P}">Life-size sheet. Print at 100% (Actual size), not Fit to page.</text>
    <rect x="16" y="34" width="85.6" height="53.98" rx="3.18" fill="none" stroke="${P}" stroke-width=".35" stroke-dasharray="2 1.2"/>
    <text x="58.8" y="59" text-anchor="middle" font-size="3.4" font-family="Manrope, Arial, sans-serif" fill="${P}">A bank card should fit</text>
    <text x="58.8" y="64" text-anchor="middle" font-size="3.4" font-family="Manrope, Arial, sans-serif" fill="${P}">this box exactly.</text>
    <text x="16" y="100" font-size="3" font-family="JetBrains Mono, monospace" fill="#6B6B6B">CUT OUT, FOLD THE BRACELET ROUND YOUR WRIST</text>
    ${watchOn(MODELS.acier, 48, 175)}${watchOn(MODELS.cadre, 128, 175)}
    <rect x="${rx - 2}" y="${ry0 - 4}" width="16" height="258" fill="none" stroke="${P}" stroke-width=".3" stroke-dasharray="1.2 1"/>
    ${ruler}
    <text x="${rx + 6}" y="${ry0 - 6}" text-anchor="middle" font-size="2.8" font-family="JetBrains Mono, monospace" fill="#6B6B6B">WRIST, cm</text>
  </svg>`;
}
function vC() {
  const M = MODELS[state.m];
  return `<div class="c-grid">
    <div class="sheet">${sheet()}</div>
    <div><p class="lead">Print <em>both Models</em> at life size, and try them on paper.</p>
      <ol class="c-list">
        <li><span><b>Print at 100%.</b> Choose "Actual size", not "Fit to page".</span></li>
        <li><span><b>Check the scale.</b> A bank card should fit the dashed box exactly.</span></li>
        <li><span><b>Measure your wrist</b> with the ruler strip down the side.</span></li>
        <li><span><b>Cut out ${M.name}</b> and fold its bracelet round your wrist to see how much it covers.</span></li>
      </ol>
      <button type="button" class="dl" data-noop>Download the life-size sheet (PDF)</button>
      <p class="mono-cap" style="margin:10px 0 0">A4 and US Letter. In this prototype the button does nothing.</p>
    </div>
  </div>${facts()}`;
}

/* ── D · on the wrist: captioned photos on two wrist sizes ── */
function vD(noFacts) {
  const M = MODELS[state.m];
  const sizes = M.shape === "square" ? [15, 18] : [16, 19];
  const shot = cm => `<div><div class="ph"><div class="need"><b>${M.name} on a ${cm} cm wrist</b><span>Photo needed: straight down, natural light, the same framing for both wrists</span></div></div>
    <div class="cap"><span>Worn on a <b>${cm} cm</b> wrist</span><span>${M.dial} Dial</span></div></div>`;
  return `<p class="lead">How <em>${M.name}</em> looks on two different wrists.</p>
  <div class="d-photos">${sizes.map(shot).join("")}</div>
  ${noFacts ? "" : facts()}`;
}

/* ── E · chosen: D's photos, then A's wrist guide, then the facts ── */
function vE() {
  return `${vD(true)}<div style="margin-top:48px">${vA(true)}</div>${facts()}`;
}

/* ── notes ── */
const NOTES = {
  e: { t: "Chosen · Photos, then wrist guide", s: "D\u2019s two captioned wrist photos, then A\u2019s wrist guide, then the three facts.", d: [
    ["Order", "Photos on two wrists first, because they answer \u201chow does it look on a wrist?\u201d at a glance. Then the wrist guide for the buyer\u2019s own size. Then bracelet range, measuring and taking out links."],
    ["Before the photos exist", "The photo row is left out and the section opens on the wrist guide."],
    ["CADRE", "No \u201csquare cases wear larger\u201d line. The figures and the drawing speak for themselves."]
  ] },
  a: { t: "A · Wrist guide", s: "The buyer picks their wrist size and sees the watch drawn on it, to scale.", d: [
    ["Shape", "Wrist chips from 14 to 21 cm. The drawing shows the wrist from above with the watch on it, both at one scale, and marks the lug to lug against the top of the wrist."],
    ["Answer", "A plain verdict: the lugs sit inside the top of the wrist, or reach past it. It also says how much of the wrist top the watch covers."],
    ["Estimate", "The top of a wrist is taken as a third of its size, a rule of thumb. The caption says so."],
    ["Trade-off", "Works on any screen with no setup, and in the same line-drawing language as the spec table. It's an estimate, not the real watch on the buyer's own wrist."]
  ] },
  b: { t: "B · Life size on screen", s: "The buyer matches a bank card on screen, then sees the watch at its real size.", d: [
    ["Shape", "Step 1: a dashed card outline and a slider. Step 2: the front and side of the watch at life size."],
    ["Why", "Screens differ in size, so nothing on screen is life size until it's calibrated against something everyone owns."],
    ["Trade-off", "The truest answer to “how big is it?” without printing. It takes two steps and a card, and few buyers will do the calibration."]
  ] },
  c: { t: "C · Printable sheet", s: "A PDF with both Models at life size, a bank-card check and a wrist ruler.", d: [
    ["Shape", "A preview of the sheet, four short steps and a download button. One sheet carries both Models, so a buyer can compare them on their own wrist."],
    ["Build", "Two static PDFs (A4 and US Letter), made once from the figures. They are remade only if the samples change a figure."],
    ["Trade-off", "The most accurate check, and the only one that puts a real outline on the wrist. It needs a printer, which many buyers won't use."]
  ] },
  d: { t: "D · On the wrist", s: "Two photos of the Model worn on two wrist sizes, each captioned with the wrist size.", d: [
    ["Shape", "Two photos side by side, the same framing, captioned “Worn on a 16 cm wrist” and so on, then the shared facts."],
    ["Why", "Research found photos on a wrist, captioned with the wrist size, are the best-supported fit help, and the cheapest to run."],
    ["Depends on", "Photos that don't exist yet: two wrists for each Model, four shots in all. “Inventory the product imagery” has to plan them."],
    ["Trade-off", "The most natural answer, and no tool to learn. It shows two wrists, which may not be the buyer's."]
  ] }
};
const COMMON = [
  "A full-width Size & fit section below the first screen, before Specifications, reached from the “Size & fit” link under Add to bag.",
  "The same section for both Models, with no extra line for CADRE.",
  "Wrist sizes are in cm only.",
  "Three facts under every form: the bracelet range (hidden until a sample is measured), how to measure your wrist, and how to take out links.",
  "The forms can be combined. D's photos work with any of the other three."
];
const OPEN = [
  "Which form, or which combination.",
  "Taking out links: the help depends on the pin type (from “Verify the specs against the samples”) and on whether the Supplier can size bracelets before Dispatch (“Decide how orders reach the Supplier”). This ticket can only reserve the slot."
];
function renderNotes() {
  const N = NOTES[state.v];
  $("#notes").innerHTML = `<h2>${N.t}</h2><p class="sub">${N.s}</p>
    <dl>${N.d.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <h3>In every form</h3><ul>${COMMON.map(c => `<li>${c}</li>`).join("")}</ul>
    <h3>Still to decide</h3><ul>${OPEN.map(c => `<li>${c}</li>`).join("")}</ul>`;
}

/* ── page ── */
function render() {
  const M = MODELS[state.m], vp = $("#vp"), keep = vp.scrollTop;
  const body = { a: () => vA(), b: vB, c: vC, d: () => vD(), e: vE }[state.v]();
  vp.innerHTML = `<div class="pdp" data-model="${state.m}">
    <header class="hdr"><nav><span aria-current="${state.m === "acier"}">ACIER</span><span aria-current="${state.m === "cadre"}">CADRE</span></nav><span class="menu">Menu</span><span class="wm">FOSLN</span><div class="tools"><span class="cur">USD $</span><span>Bag</span></div></header>
    <div class="stub"><div class="box"><b>The bench, photo strip and About</b><span>Settled in “Design the PDP layout”</span></div></div>
    <section class="sec" id="fit" aria-labelledby="fit-h"><div class="wrap">
      <div class="sec-head"><h2 class="blk-h" id="fit-h">Size & fit</h2><span class="for">${M.name} · <b>${M.shape === "square" ? `${M.W} × ${M.L} mm` : `${M.W} mm`}</b></span></div>
      ${body}
    </div></section>
    <div class="stub"><div class="box"><b>Specifications</b><span>The drawing and Size rows from “Design the spec table”</span></div></div>
    <footer class="foot"><span class="wm" style="font-size:14px">FOSLN</span><span>Prices in USD</span></footer>
  </div>`;
  vp.scrollTop = keep;
  document.querySelectorAll(".grp[data-group]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === state[g.dataset.group]))));
  $("#proto").dataset.frame = state.f;
  $("#url").textContent = `fosln.com/products/${state.m}#fit`;
  $("#notes").hidden = !state.notes;
  $("#notes-btn").setAttribute("aria-pressed", String(state.notes));
  if (state.notes) renderNotes();
  try { history.replaceState(null, "", "#" + [state.v, state.m, state.f, state.r].join("-")); } catch (e) {}
}

(function () {
  const p = (location.hash || "").slice(1).split("-");
  if (p.length !== 4) return;
  const [v, m, f, r] = p;
  if (["a", "b", "c", "d", "e"].includes(v)) state.v = v;
  if (MODELS[m]) state.m = m;
  if (f === "desktop" || f === "phone") state.f = f;
  if (r === "none" || r === "ex") state.r = r;
})();

document.addEventListener("click", e => {
  const gb = e.target.closest(".grp[data-group] button");
  if (gb) { state[gb.closest(".grp").dataset.group] = gb.dataset.val; render(); return; }
  if (e.target.closest("#notes-btn")) { state.notes = !state.notes; render(); return; }
  const chip = e.target.closest(".chip");
  if (chip) { state.wrist = +chip.dataset.wrist; render(); return; }
  const kb = e.target.closest("[data-k]");
  if (kb) { state.k = Math.min(7, Math.max(2.4, state.k + (kb.dataset.k === "+" ? .02 : -.02))); render(); return; }
  if (e.target.closest("[data-noop]")) e.preventDefault();
});
document.addEventListener("input", e => {
  if (e.target.id !== "kr") return;
  state.k = +e.target.value;
  render();
  const r = document.getElementById("kr"); if (r) r.focus();
});

render();
</script>
